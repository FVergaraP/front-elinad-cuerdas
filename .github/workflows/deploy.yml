name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write   # para avisar por Issue cuando el contenido tiene un error

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        id: construir

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist/

      # Si el contenido quedó mal escrito, el build falla y NO se publica
      # (la página online se mantiene como estaba). Abrimos un Issue para
      # que quien editó se entere: GitHub lo envía por correo.
      - name: Avisar si el contenido tiene errores
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const titulo = '⚠️ Hay un error en el contenido del sitio';
            const cuerpo = [
              'El último cambio **no se pudo publicar** porque algo del contenido quedó mal escrito.',
              '',
              '✅ **La página sigue funcionando** con la versión anterior. No se rompió nada.',
              '',
              `👉 [Ver qué hay que corregir](${url})`,
              '',
              'En esa pantalla, busca el recuadro con el mensaje en español: dice exactamente qué campo arreglar.',
              '',
              'Si necesitas ayuda, revisa la sección "Si algo sale mal" de la [guía de edición](../blob/main/GUIA-EDICION.md).',
            ].join('\n');

            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'contenido',
            });

            if (abiertos.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: abiertos.data[0].number,
                body: cuerpo,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titulo,
                body: cuerpo,
                labels: ['contenido'],
              });
            }

  deploy:
    # Solo despliega desde main, no desde PRs
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
